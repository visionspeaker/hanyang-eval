/* --- 평가자: 부서 결과 계산 --- */
// 절대평가 기준 (부서원이 4명 미만이어서 비율 분포가 무의미할 때 사용)
// 매우우수(10) → 100, 우수(9) → 90, 보통(8) → 80, 미흡(7) → 70 에 대응
const ABS_GRADE_THRESHOLDS = { S: 90, A: 80, B: 70 }; // 그 외 C
function gradeByAbsoluteScore(score) {
  if (score >= ABS_GRADE_THRESHOLDS.S) return "S";
  if (score >= ABS_GRADE_THRESHOLDS.A) return "A";
  if (score >= ABS_GRADE_THRESHOLDS.B) return "B";
  return "C";
}

// 부서원이 3명 미만(1~2명)이면 절대평가, 3명 이상이면 상대평가(S20/A30/B40/C10)
const SMALL_DEPT_THRESHOLD = 3;

function computeDeptResults(dept, period) {
  // 부장/이사(임원 평가 대상) 는 부서 등급 산정에서 제외 — 임원 풀에서 별도 산정
  const emps = EMPLOYEES.filter(e => e.dept === dept && !isExecEmp(e));
  const evals = getEvaluationsByPeriod(period);
  const rows = emps.map(e => {
    const e1 = evals.find(x => x.dept===dept && x.empName===e.name && x.round==="1차");
    const e2 = evals.find(x => x.dept===dept && x.empName===e.name && x.round==="2차");
    let avg = null;
    if (e1 && e2) avg = (e1.total + e2.total)/2;
    else if (e1) avg = e1.total;
    else if (e2) avg = e2.total;
    // 가감점 조회 (원점수 유지 + 조정평균 별도)
    const adjustment = getAdjustmentTotal(period, dept, e.name);
    const avgAdjusted = avg !== null ? avg + adjustment : null;
    return {
      empName: e.name,
      empRank: e.rank,
      rankCategory: e.rankCategory,
      score1: e1 ? e1.total : null,
      score2: e2 ? e2.total : null,
      avg,                  // 원 평균 (변경 없음 · 감사 기록)
      adjustment,           // 가감점 합계
      avgAdjusted           // 등급 산정에 사용되는 조정 평균
    };
  });
  // 조정 평균 기준 정렬 (평균 없는 사람 뒤). 조정 평균이 없으면 원평균 fallback
  const sortKey = r => (r.avgAdjusted != null ? r.avgAdjusted : r.avg);
  rows.sort((a,b) => {
    const ka = sortKey(a), kb = sortKey(b);
    if (ka === null && kb === null) return 0;
    if (ka === null) return 1;
    if (kb === null) return -1;
    return kb - ka;
  });
  // 부서 내 순위 및 등급 산정 (평균이 있는 인원만)
  const submitted = rows.filter(r => r.avg !== null);
  const total = submitted.length;

  // 부서 인원에 따라 상대평가 / 절대평가 분기
  const useAbsolute = emps.length < SMALL_DEPT_THRESHOLD;

  if (useAbsolute) {
    submitted.forEach((r, i) => {
      r.rankIndex = i + 1;
      r.grade = gradeByAbsoluteScore(r.avgAdjusted !== null ? r.avgAdjusted : r.avg);
      r.gradingMode = "absolute";
    });
  } else {
    const sCount = Math.round(total * 0.2);
    const aCount = Math.round(total * 0.3);
    const bCount = Math.round(total * 0.4);
    let cCount = total - sCount - aCount - bCount;
    if (cCount < 0) cCount = 0;
    submitted.forEach((r, i) => {
      r.rankIndex = i + 1;
      if (i < sCount) r.grade = "S";
      else if (i < sCount + aCount) r.grade = "A";
      else if (i < sCount + aCount + bCount) r.grade = "B";
      else r.grade = "C";
      r.gradingMode = "distribution";
    });
  }
  rows.forEach((r, i) => {
    if (r.avg === null) {
      r.rankIndex = "-";
      r.grade = null;
      r.gradingMode = null;
    }
  });
  rows._gradingMode = useAbsolute ? "absolute" : "distribution";
  rows._deptSize = emps.length;
  return rows;
}

/* --- 임원(부장·이사) 평가 결과 계산 ---
 * 3차(조규오 OR 임웅걸), 4차(양정일) 점수를 평균해서 avg 산출.
 * 11명 전체를 하나의 풀로 S20/A30/B40/C10 상대평가.
 */
function computeExecResults(period) {
  const emps = EMPLOYEES.filter(isExecEmp);
  const evals = getEvaluationsByPeriod(period);
  const rows = emps.map(e => {
    const r3kq = evals.find(x => x.dept===e.dept && x.empName===e.name && x.round==="3차-조규오");
    const r3iw = evals.find(x => x.dept===e.dept && x.empName===e.name && x.round==="3차-임웅걸");
    const r4   = evals.find(x => x.dept===e.dept && x.empName===e.name && x.round==="4차");
    // 3차: 대상자별로 조규오 또는 임웅걸 중 한 명만 평가 (둘 다 있으면 평균)
    let score3 = null, eval3Name = null;
    const arr3 = [];
    if (r3kq) { arr3.push(r3kq.total); eval3Name = r3kq.evaluatorName; }
    if (r3iw) { arr3.push(r3iw.total); eval3Name = eval3Name ? `${eval3Name}, ${r3iw.evaluatorName}` : r3iw.evaluatorName; }
    if (arr3.length) score3 = arr3.reduce((a,b)=>a+b,0)/arr3.length;
    const score4 = r4 ? r4.total : null;
    const parts = [];
    if (score3 !== null) parts.push(score3);
    if (score4 !== null) parts.push(score4);
    const avg = parts.length ? parts.reduce((a,b)=>a+b,0)/parts.length : null;
    // 임원 대상자도 가감점 반영 (없으면 0)
    const adjustment = getAdjustmentTotal(period, e.dept, e.name);
    const avgAdjusted = avg !== null ? avg + adjustment : null;
    return {
      dept: e.dept, empName: e.name, empRank: e.rank, rankCategory: e.rankCategory,
      score3, score4, eval3Name,
      eval4Name: r4 ? r4.evaluatorName : null,
      avg, adjustment, avgAdjusted
    };
  });
  const sortKey = r => (r.avgAdjusted != null ? r.avgAdjusted : r.avg);
  rows.sort((a,b) => {
    const ka = sortKey(a), kb = sortKey(b);
    if (ka === null && kb === null) return 0;
    if (ka === null) return 1;
    if (kb === null) return -1;
    return kb - ka;
  });
  const submitted = rows.filter(r => r.avg !== null);
  const total = submitted.length;
  const useAbsolute = emps.length < SMALL_DEPT_THRESHOLD;
  if (useAbsolute) {
    submitted.forEach((r, i) => { r.rankIndex = i + 1; r.grade = gradeByAbsoluteScore(r.avgAdjusted !== null ? r.avgAdjusted : r.avg); r.gradingMode = "absolute"; });
  } else {
    const sCount = Math.round(total * 0.2);
    const aCount = Math.round(total * 0.3);
    const bCount = Math.round(total * 0.4);
    submitted.forEach((r, i) => {
      r.rankIndex = i + 1;
      if (i < sCount) r.grade = "S";
      else if (i < sCount + aCount) r.grade = "A";
      else if (i < sCount + aCount + bCount) r.grade = "B";
      else r.grade = "C";
      r.gradingMode = "distribution";
    });
  }
  rows.forEach(r => { if (r.avg === null) { r.rankIndex = "-"; r.grade = null; r.gradingMode = null; } });
  rows._gradingMode = useAbsolute ? "absolute" : "distribution";
  rows._deptSize = emps.length;
  return rows;
}

// 해당 부서가 어떤 등급 산정 방식을 쓰는지 레이블 반환
function gradingModeLabel(results) {
  if (results._gradingMode === "absolute") {
    return `절대평가 (부서원 ${results._deptSize}명 · 점수 기준)`;
  }
  return `상대평가 (S 20% · A 30% · B 40% · C 10%)`;
}

function gradeDistribution(results) {
  const out = { S: [], A: [], B: [], C: [] };
  results.forEach(r => {
    if (r.grade) out[r.grade].push(r);
  });
  return out;
}

function renderDistBar(dist) {
  const total = dist.S.length + dist.A.length + dist.B.length + dist.C.length;
  if (total === 0) return `<div class="muted">제출된 평가가 없습니다.</div>`;
  const w = g => (dist[g].length / total * 100).toFixed(1);
  return `
    <div class="dist-bar">
      ${dist.S.length ? `<div class="dist-s" style="width:${w('S')}%">S ${dist.S.length}</div>` : ''}
      ${dist.A.length ? `<div class="dist-a" style="width:${w('A')}%">A ${dist.A.length}</div>` : ''}
      ${dist.B.length ? `<div class="dist-b" style="width:${w('B')}%">B ${dist.B.length}</div>` : ''}
      ${dist.C.length ? `<div class="dist-c" style="width:${w('C')}%">C ${dist.C.length}</div>` : ''}
    </div>
  `;
}

function deptAverage(results) {
  const vals = results.map(r => r.avg).filter(v => v !== null);
  if (!vals.length) return "-";
  return (vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1);
}
