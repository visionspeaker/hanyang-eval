<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>한양전공 인사평가 시스템</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --primary: #1e3a8a;
    --primary-dark: #172554;
    --accent: #2563eb;
    --bg: #f4f6fb;
    --card: #ffffff;
    --border: #e5e7eb;
    --text: #111827;
    --muted: #6b7280;
    --success: #059669;
    --warning: #d97706;
    --danger: #dc2626;
    --s-color: #7c3aed;
    --a-color: #2563eb;
    --b-color: #059669;
    --c-color: #dc2626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header.topbar {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    color: #fff;
    padding: 18px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  header.topbar h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }
  header.topbar .sub {
    font-size: 12px;
    opacity: 0.85;
    margin-top: 2px;
  }
  header.topbar .right {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .container {
    max-width: 1100px;
    margin: 28px auto;
    padding: 0 20px;
  }
  .card {
    background: var(--card);
    border-radius: 12px;
    border: 1px solid var(--border);
    padding: 24px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    margin-bottom: 20px;
  }
  h2 { margin: 0 0 16px; font-size: 18px; font-weight: 700; }
  h3 { margin: 0 0 12px; font-size: 15px; font-weight: 600; color: var(--primary); }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .col { flex: 1; min-width: 200px; }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
    color: #374151;
  }
  input, select, textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    background: #fff;
  }
  input:focus, select:focus, textarea:focus {
    outline: 2px solid var(--accent);
    outline-offset: -1px;
    border-color: transparent;
  }
  textarea { resize: vertical; min-height: 80px; }
  button {
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    background: var(--primary);
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    font-size: 14px;
    font-family: inherit;
    transition: background 0.15s;
  }
  button:hover { background: var(--primary-dark); }
  button.secondary {
    background: #fff;
    color: var(--primary);
    border: 1px solid var(--primary);
  }
  button.secondary:hover { background: #eff6ff; }
  button.ghost {
    background: transparent;
    color: #fff;
    border: 1px solid rgba(255,255,255,0.35);
  }
  button.ghost:hover { background: rgba(255,255,255,0.15); }
  .status-badge {
    display: inline-flex;
    align-items: center;
    padding: 6px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    background: rgba(255,255,255,0.15);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.2);
    margin-right: 4px;
  }
  .status-badge.ok    { background: rgba(16,185,129,0.25); border-color: rgba(16,185,129,0.4); }
  .status-badge.local { background: rgba(148,163,184,0.25); border-color: rgba(148,163,184,0.4); }
  .status-badge.err   { background: rgba(239,68,68,0.3); border-color: rgba(239,68,68,0.5); cursor: pointer; }
  /* 반기(period) 뱃지 — 짙은 헤더 위에서도 잘 보이도록 노란 계열 */
  .period-badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 6px 12px; border-radius: 999px;
    background: #f59e0b; color: #1c1c1c;
    font-size: 12px; font-weight: 700;
    border: 1px solid rgba(0,0,0,0.05);
    white-space: nowrap;
  }
  .period-badge.past { background: #94a3b8; color: #fff; }
  .period-pill { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; font-weight:600; border:1px solid transparent; }
  .period-pill.active   { background:#dcfce7; color:#166534; border-color:#86efac; }
  .period-pill.closed   { background:#f1f5f9; color:#475569; border-color:#cbd5e1; }
  .period-pill.upcoming { background:#e0f2fe; color:#075985; border-color:#7dd3fc; }
  button.danger { background: var(--danger); }
  button.danger:hover { background: #b91c1c; }
  button.small { padding: 6px 12px; font-size: 12px; }
  .hidden { display: none !important; }
  .flex { display: flex; gap: 12px; align-items: center; }
  .flex.between { justify-content: space-between; }
  .notice {
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 12px;
  }
  .notice.info { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
  .notice.warn { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
  .notice.err { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
  .notice.ok { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  table th, table td {
    border: 1px solid var(--border);
    padding: 8px 10px;
    text-align: left;
  }
  table th {
    background: #f9fafb;
    font-weight: 600;
    color: #374151;
  }
  .chip {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
  }
  .chip.s { background: #ede9fe; color: var(--s-color); }
  .chip.a { background: #dbeafe; color: var(--a-color); }
  .chip.b { background: #d1fae5; color: var(--b-color); }
  .chip.c { background: #fee2e2; color: var(--c-color); }
  .chip.done { background: #dcfce7; color: #166534; }
  .chip.pending { background: #fef3c7; color: #92400e; }
  .chip.rank { background: #f3f4f6; color: #374151; }
  .hero {
    text-align: center;
    padding: 48px 20px 32px;
  }
  .hero .title-row {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 10px;
  }
  .hero .title-row .brand-badge {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 18px rgba(37,99,235,0.25);
  }
  .hero h1 {
    margin: 0;
    font-size: 34px;
    font-weight: 800;
    letter-spacing: -0.8px;
    color: #0f172a;
  }
  .hero .hero-sub {
    color: #64748b;
    font-size: 15px;
    margin-top: 4px;
  }
  .landing-wrap {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-top: 24px;
  }
  @media (max-width: 820px) {
    .landing-wrap { grid-template-columns: 1fr; }
    .hero h1 { font-size: 26px; }
  }
  .choice-card {
    position: relative;
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 16px;
    padding: 36px 24px 32px;
    text-align: center;
    cursor: pointer;
    transition: transform 0.25s cubic-bezier(.2,.8,.2,1), box-shadow 0.25s, border-color 0.2s;
    overflow: hidden;
  }
  .choice-card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, var(--card-accent-1, #eff6ff) 0%, transparent 60%);
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  .choice-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 20px 40px rgba(15,23,42,0.1), 0 6px 12px rgba(15,23,42,0.06);
    border-color: var(--card-border-hover, #3b82f6);
  }
  .choice-card:hover::before { opacity: 1; }
  .choice-card:active { transform: translateY(-3px); }
  .choice-card .icon-wrap {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 64px;
    height: 64px;
    border-radius: 16px;
    margin-bottom: 18px;
    background: var(--card-icon-bg, #dbeafe);
    transition: transform 0.3s cubic-bezier(.2,.8,.2,1), background 0.2s;
  }
  .choice-card:hover .icon-wrap {
    transform: scale(1.08) rotate(-4deg);
  }
  .choice-card .icon-wrap svg {
    width: 30px;
    height: 30px;
    color: var(--card-icon-color, #2563eb);
  }
  .choice-card h3 {
    position: relative;
    margin: 0 0 6px;
    font-size: 19px;
    font-weight: 700;
    color: #0f172a;
    transition: color 0.2s;
  }
  .choice-card:hover h3 { color: var(--card-icon-color, #2563eb); }
  .choice-card p {
    position: relative;
    margin: 0;
    color: #64748b;
    font-size: 13.5px;
    line-height: 1.55;
  }
  .choice-card.c-eval    { --card-icon-bg:#dbeafe; --card-icon-color:#2563eb; --card-border-hover:#3b82f6; --card-accent-1:#eff6ff; }
  .choice-card.c-view    { --card-icon-bg:#dcfce7; --card-icon-color:#059669; --card-border-hover:#10b981; --card-accent-1:#ecfdf5; }
  .choice-card.c-admin   { --card-icon-bg:#ede9fe; --card-icon-color:#7c3aed; --card-border-hover:#8b5cf6; --card-accent-1:#f5f3ff; }
  .info-panel {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    padding: 22px 26px;
    margin-top: 28px;
    box-shadow: 0 1px 2px rgba(15,23,42,0.04);
  }
  .info-panel .ip-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
    font-size: 15px;
    color: #0f172a;
    margin-bottom: 10px;
  }
  .info-panel .ip-title svg { width: 18px; height: 18px; color: #2563eb; }
  .info-panel ul {
    margin: 0;
    padding-left: 18px;
    color: #475569;
    font-size: 13.5px;
    line-height: 1.85;
  }
  .info-panel ul b { color: #0f172a; }
  .eval-table { font-size: 12.5px; }
  .eval-table td { vertical-align: middle; }
  .eval-table td.area { font-weight: 700; background: #f9fafb; text-align: center; writing-mode: initial; }
  .eval-table td.item { font-weight: 600; width: 140px; }
  .eval-table td.desc { font-size: 11.5px; color: #4b5563; line-height: 1.45; white-space: pre-line; }
  .score-radio-group {
    display: flex;
    gap: 4px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .score-radio-group label {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    min-width: 48px;
    margin: 0;
    background: #fff;
    font-size: 11px;
    font-weight: 600;
    color: #374151;
  }
  .score-radio-group label input { width: 0; height: 0; opacity: 0; margin: 0; position: absolute; }
  .score-radio-group label .sv { font-size: 14px; color: var(--primary); font-weight: 700; }
  .score-radio-group label.checked {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }
  .score-radio-group label.checked .sv { color: #fff; }
  .subtotal-cell {
    background: #f3f4f6;
    text-align: center;
    font-weight: 700;
    color: var(--primary);
  }
  .total-row td {
    background: var(--primary);
    color: #fff;
    font-weight: 700;
    font-size: 15px;
    padding: 12px;
  }
  .employee-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
    margin-top: 12px;
  }
  .emp-card {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    background: #fff;
    cursor: pointer;
    transition: all 0.15s;
  }
  .emp-card:hover {
    border-color: var(--accent);
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
  }
  .emp-card .name {
    font-weight: 700;
    font-size: 15px;
    margin-bottom: 4px;
  }
  .emp-card .meta {
    font-size: 12px;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 6px;
  }
  .tabs {
    display: flex;
    border-bottom: 2px solid var(--border);
    margin-bottom: 20px;
    gap: 4px;
  }
  .tab {
    padding: 10px 18px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
    border-bottom: 2px solid transparent;
    margin-bottom: -2px;
  }
  .tab.active {
    color: var(--primary);
    border-bottom-color: var(--primary);
  }
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .stat-box {
    padding: 16px;
    border-radius: 10px;
    background: #fff;
    border: 1px solid var(--border);
    text-align: center;
  }
  .stat-box .label { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .stat-box .value { font-size: 24px; font-weight: 700; color: var(--primary); }
  .dist-bar {
    display: flex;
    height: 28px;
    border-radius: 6px;
    overflow: hidden;
    margin-top: 8px;
  }
  .dist-bar div {
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 12px;
    font-weight: 700;
  }
  .dist-s { background: var(--s-color); }
  .dist-a { background: var(--a-color); }
  .dist-b { background: var(--b-color); }
  .dist-c { background: var(--c-color); }
  .grade-big {
    display: inline-block;
    width: 56px;
    height: 56px;
    line-height: 56px;
    text-align: center;
    border-radius: 10px;
    font-size: 28px;
    font-weight: 800;
    color: #fff;
  }
  .grade-big.S { background: var(--s-color); }
  .grade-big.A { background: var(--a-color); }
  .grade-big.B { background: var(--b-color); }
  .grade-big.C { background: var(--c-color); }
  .muted { color: var(--muted); font-size: 12px; }
  .mini { font-size: 12px; color: var(--muted); }
  .pw-view {
    font-family: monospace;
    background: #fef3c7;
    color: #92400e;
    padding: 3px 8px;
    border-radius: 4px;
    font-weight: 700;
    letter-spacing: 1px;
  }
  .pw-hidden {
    font-family: monospace;
    color: #9ca3af;
  }
  .inline-link { color: var(--accent); cursor: pointer; text-decoration: underline; font-size: 12px; }
  @media (max-width: 640px) {
    header.topbar { padding: 14px 16px; flex-direction: column; align-items: flex-start; gap: 10px; }
    .container { padding: 0 12px; }
    .card { padding: 16px; }
    .eval-table td.desc { display: none; }
  }
</style>
</head>

  <div>
    <h1>한양전공 인사평가 시스템</h1>
    <div class="sub">2026년 인사평가 · 평가자 / 관리자 포털</div>

  <div class="right" id="top-actions"></div>

<div class="container" id="app"></div>

/* ========== 반기(period) 유틸 ==========
 *   내부 id: "YYYY-H1" / "YYYY-H2"
 *   표시 label: "YYYY년 상반기" / "YYYY년 하반기"
 *   status: "active" (진행 중) | "closed" (마감됨) | "upcoming" (예정)
 *
 *   자동 규칙: 오늘 월 <= 6 → 상반기(H1), 그 외 → 하반기(H2)
 *   서버의 activePeriod 가 있으면 그 값이 우선.
 */
function computeDefaultPeriodId(d) {
  d = d || new Date();
  const y = d.getFullYear();
  const m = d.getMonth() + 1;
  return y + (m <= 6 ? "-H1" : "-H2");
}
function periodLabel(id) {
  if (!id) return "";
  const m = String(id).match(/^(\d{4})-H([12])$/);
  if (!m) return id;
  return m[1] + "년 " + (m[2] === "1" ? "상반기" : "하반기");
}
function periodSortKey(id) {
  const m = String(id).match(/^(\d{4})-H([12])$/);
  if (!m) return 0;
  return Number(m[1]) * 10 + Number(m[2]);
}
// settings 기본값 (첫 실행 시)
function makeDefaultSettings() {
  const now = new Date();
  const cur = computeDefaultPeriodId(now);
  const nowIso = now.toISOString();
  const periods = [];
  // 지금이 하반기라면 상반기(마감), 하반기(활성) 두 개를 기본 세팅해서
  // 기존에 이미 있는 상반기 데이터를 자연스럽게 조회할 수 있게 함.
  if (/H2$/.test(cur)) {
    const h1 = cur.replace("H2","H1");
    periods.push({ id: h1, status: "closed", createdAt: nowIso, closedAt: nowIso });
  }
  periods.push({ id: cur, status: "active", createdAt: nowIso, closedAt: null });
  return { activePeriod: cur, periods };
}
// 저장된 settings 를 정합성 있게 정리 (누락된 활성/미마감 처리, 정렬)
function normalizeSettings(s) {
  const src = s && typeof s === "object" ? s : {};
  const periods = Array.isArray(src.periods) ? src.periods.slice() : [];
  const seen = {};
  const cleaned = [];
  periods.forEach(p => {
    if (!p || !p.id || seen[p.id]) return;
    seen[p.id] = true;
    cleaned.push({
      id: String(p.id),
      status: (p.status === "closed" || p.status === "upcoming" || p.status === "active") ? p.status : "active",
      createdAt: p.createdAt || null,
      closedAt: p.closedAt || null
    });
  });
  let active = src.activePeriod || null;
  if (active && !seen[active]) {
    cleaned.push({ id: active, status: "active", createdAt: new Date().toISOString(), closedAt: null });
    seen[active] = true;
  }
  if (!active) {
    const openOne = cleaned.find(p => p.status === "active");
    active = openOne ? openOne.id : (cleaned[0] ? cleaned[0].id : computeDefaultPeriodId());
    if (!seen[active]) cleaned.push({ id: active, status: "active", createdAt: new Date().toISOString(), closedAt: null });
  }
  // active 반기는 status=active 로 강제 정합 (다른 것은 그대로 유지 하되 active 표시 유일화)
  cleaned.forEach(p => {
    if (p.id === active) p.status = "active";
    else if (p.status === "active") p.status = "closed";
  });
  cleaned.sort((a,b) => periodSortKey(b.id) - periodSortKey(a.id)); // 최신이 위로
  return { activePeriod: active, periods: cleaned };
}
function getSettings() {
  if (!_cache.settings) _cache.settings = normalizeSettings(makeDefaultSettings());
  return _cache.settings;
}
function getActivePeriod() { return getSettings().activePeriod; }
function isPeriodClosed(id) {
  const p = getSettings().periods.find(x => x.id === id);
  return !!(p && p.status === "closed");
}
function isPeriodEditable(id) {
  // 활성 반기는 항상 편집 가능, 마감된 반기는 관리자만 편집 가능
  if (id === getActivePeriod()) return true;
  return !!session.isAdmin;
}

function loadStore(key, fallback) {
  try {
    const v = localStorage.getItem(key);
    return v ? JSON.parse(v) : fallback;
  } catch(e) {
    return fallback;
  }
}
function saveStore(key, data) {
  try { localStorage.setItem(key, JSON.stringify(data)); } catch(e) { console.error(e); }
}

/* ---- 원격 호출 (Apps Script Web App) ----
 * 주의: POST 에서 CORS preflight 를 피하기 위해
 *       Content-Type 을 text/plain 으로 설정합니다.
 *       Apps Script 는 e.postData.contents 로 원문을 그대로 받습니다.
 */
async function remoteGet() {
  const url = BACKEND_URL + (BACKEND_URL.includes("?") ? "&" : "?") + "t=" + Date.now();
  const res = await fetch(url, { method: "GET" });
  if (!res.ok) throw new Error("GET " + res.status);
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || "server error");
  return data;
}
async function remotePost(action, payload) {
  const res = await fetch(BACKEND_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action, payload })
  });
  if (!res.ok) throw new Error("POST " + res.status);
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || "server error");
  return data;
}

/* ---- 초기 로딩 (앱 시작 시 1회, 새로고침 시 재호출) ---- */
async function initData() {
  if (IS_REMOTE()) {
    try {
      const data = await remoteGet();
      // 서버에 없는 신규 평가자(예: 임원 3차/4차) 가 DEFAULT_EVALUATORS 에 추가된 경우
      // 자동으로 채워지도록 병합. 서버에 있는 항목은 서버 값이 우선.
      const serverEvs = data.evaluators || {};
      // 구 부서명 → 신 부서명 rename 안전망 (서버 시트 정리 전까지)
      const DEPT_RENAME = { "신재생영업부": "신재생에너지영업부" };
      Object.keys(serverEvs).forEach(d => {
        const nd = DEPT_RENAME[d];
        if (nd && !serverEvs[nd]) { serverEvs[nd] = serverEvs[d]; delete serverEvs[d]; }
      });
      (data.evaluations || []).forEach(e => { if (DEPT_RENAME[e.dept]) e.dept = DEPT_RENAME[e.dept]; });
      const mergedEvs = JSON.parse(JSON.stringify(DEFAULT_EVALUATORS));
      Object.keys(serverEvs).forEach(dept => {
        if (!mergedEvs[dept]) mergedEvs[dept] = {};
        Object.keys(serverEvs[dept]).forEach(round => {
          mergedEvs[dept][round] = serverEvs[dept][round];
        });
      });
      _cache.evaluators  = mergedEvs;
      _cache.evaluations = (data.evaluations || []).map(fillEvaluationPeriod);
      // 서버 settings 우선, 없으면 기존 데이터로부터 자동 유추
      _cache.settings    = normalizeSettings(data.settings || deriveSettingsFromEvaluations(_cache.evaluations));
      _cache.adjustments = (data.adjustments || []);
      _cache.remoteStatus = "ok";
      return;
    } catch (e) {
      console.error("원격 서버 연결 실패:", e);
      _cache.remoteStatus = "error";
      _cache.remoteError = e.message;
      // 원격 실패 시 로컬 캐시로 폴백하되, 원격 모드임을 유지
      _cache.evaluators = loadStore(STORE_KEYS.EVALUATORS, JSON.parse(JSON.stringify(DEFAULT_EVALUATORS)));
      _cache.evaluations = loadStore(STORE_KEYS.EVALUATIONS, []).map(fillEvaluationPeriod);
      _cache.settings   = normalizeSettings(loadStore(STORE_KEYS.SETTINGS, deriveSettingsFromEvaluations(_cache.evaluations)));
      _cache.adjustments = loadStore("hy_adjustments_v1", []);
      return;
    }
  }
  // 로컬 모드
  _cache.evaluators  = loadStore(STORE_KEYS.EVALUATORS, JSON.parse(JSON.stringify(DEFAULT_EVALUATORS)));
  _cache.evaluations = loadStore(STORE_KEYS.EVALUATIONS, []).map(fillEvaluationPeriod);
  _cache.settings   = normalizeSettings(loadStore(STORE_KEYS.SETTINGS, deriveSettingsFromEvaluations(_cache.evaluations)));
  _cache.adjustments = loadStore("hy_adjustments_v1", []);
  _cache.remoteStatus = "local";
}

// 기존 데이터(period 없이 저장됐던 행) 마이그레이션 — 현재 앱 세션 안에서만 적용
function fillEvaluationPeriod(ev) {
  if (!ev || typeof ev !== "object") return ev;
  if (ev.period && String(ev.period).trim()) return ev;
  // period 가 없으면 기존 데이터로 간주 → "2026-H1"
  ev.period = "2026-H1";
  return ev;
}

// evaluations 안의 period 값들을 스캔해 settings 를 유추 (서버 응답에 settings 없을 때)
function deriveSettingsFromEvaluations(evals) {
  const seen = {};
  (evals || []).forEach(e => {
    const p = e && e.period;
    if (p) seen[p] = true;
  });
  const now = new Date();
  const cur = computeDefaultPeriodId(now);
  seen[cur] = true;
  const ids = Object.keys(seen).sort((a,b) => periodSortKey(a) - periodSortKey(b));
  const nowIso = now.toISOString();
  const periods = ids.map(id => ({
    id,
    status: id === cur ? "active" : "closed",
    createdAt: nowIso,
    closedAt: id === cur ? null : nowIso
  }));
  return { activePeriod: cur, periods };
}

/* ---- 동기 getter (기존 코드 경로와 호환) ---- */
function getEvaluators() {
  if (!_cache.evaluators) return JSON.parse(JSON.stringify(DEFAULT_EVALUATORS));
  return _cache.evaluators;
}
function getEvaluations() {
  return _cache.evaluations || [];
}
function getEvaluation(dept, empName, round, period) {
  const p = period || getActivePeriod();
  return getEvaluations().find(x =>
    x.dept === dept && x.empName === empName && x.round === round && (x.period || "2026-H1") === p
  );
}
// 특정 반기의 평가만 반환 (없으면 활성 반기)
function getEvaluationsByPeriod(period) {
  const p = period || getActivePeriod();
  return getEvaluations().filter(x => (x.period || "2026-H1") === p);
}

/* ---- 비동기 writer (원격 모드면 서버로 전송, 아니면 로컬스토리지) ---- */
async function setEvaluators(v) {
  _cache.evaluators = v;
  if (!IS_REMOTE()) { saveStore(STORE_KEYS.EVALUATORS, v); return; }
  // 원격 모드에선 변경된 평가자만 updateEvaluator 로 전송해야 하지만,
  // 호출 사이트가 regenPw 하나뿐이므로 updateEvaluator 를 거기서 직접 호출합니다.
  // 여기서는 캐시 동기화만 수행.
}

async function setEvaluations(v) {
  _cache.evaluations = v;
  if (IS_REMOTE()) {
    await remotePost("setEvaluations", v);
  } else {
    saveStore(STORE_KEYS.EVALUATIONS, v);
  }
}

async function upsertEvaluation(ev) {
  // period 미지정 시 활성 반기로 자동 채움
  if (!ev.period) ev.period = getActivePeriod();
  const all = _cache.evaluations || [];
  const idx = all.findIndex(x =>
    x.dept === ev.dept && x.empName === ev.empName && x.round === ev.round && (x.period || "2026-H1") === ev.period
  );
  if (idx >= 0) all[idx] = ev; else all.push(ev);
  _cache.evaluations = all;
  if (IS_REMOTE()) {
    await remotePost("upsertEvaluation", ev);
  } else {
    saveStore(STORE_KEYS.EVALUATIONS, all);
  }
}

async function bulkUpsertEvaluations(list) {
  // period 자동 채움
  const active = getActivePeriod();
  list.forEach(ev => { if (!ev.period) ev.period = active; });
  // 캐시 병합
  const all = _cache.evaluations || [];
  list.forEach(ev => {
    const idx = all.findIndex(x => x.dept === ev.dept && x.empName === ev.empName && x.round === ev.round && (x.period || "2026-H1") === ev.period);
    if (idx >= 0) all[idx] = ev; else all.push(ev);
  });
  _cache.evaluations = all;
  if (IS_REMOTE()) {
    await remotePost("bulkUpsertEvaluations", list);
  } else {
    saveStore(STORE_KEYS.EVALUATIONS, all);
  }
}

/* ---- 반기 관리 (서버 액션 or 로컬 저장) ---- */
async function setActivePeriodRemote(periodId) {
  const s = getSettings();
  // 존재 안 하면 upcoming/closed 상태로라도 추가
  if (!s.periods.find(p => p.id === periodId)) {
    s.periods.push({ id: periodId, status: "closed", createdAt: new Date().toISOString(), closedAt: null });
  }
  s.activePeriod = periodId;
  _cache.settings = normalizeSettings(s);
  if (IS_REMOTE()) {
    try { await remotePost("setActivePeriod", { period: periodId }); } catch(e) { console.error(e); }
  } else {
    saveStore(STORE_KEYS.SETTINGS, _cache.settings);
  }
}
async function createPeriodRemote(periodId, activate) {
  const s = getSettings();
  if (!s.periods.find(p => p.id === periodId)) {
    s.periods.push({ id: periodId, status: activate ? "active" : "upcoming", createdAt: new Date().toISOString(), closedAt: null });
  }
  if (activate) s.activePeriod = periodId;
  _cache.settings = normalizeSettings(s);
  if (IS_REMOTE()) {
    try { await remotePost("createPeriod", { period: periodId, activate: !!activate }); } catch(e) { console.error(e); }
  } else {
    saveStore(STORE_KEYS.SETTINGS, _cache.settings);
  }
}
async function closePeriodRemote(periodId) {
  const s = getSettings();
  const p = s.periods.find(x => x.id === periodId);
  if (p) { p.status = "closed"; p.closedAt = new Date().toISOString(); }
  // 활성 반기가 방금 마감된 것이면, 자동으로 다음 반기(오늘 기준) 를 활성화
  if (s.activePeriod === periodId) {
    const nextId = computeDefaultPeriodId();
    if (nextId === periodId) {
      // 오늘 반기와 동일하면 활성 반기 유지 (아무것도 없음)
    } else {
      if (!s.periods.find(x => x.id === nextId)) {
        s.periods.push({ id: nextId, status: "active", createdAt: new Date().toISOString(), closedAt: null });
      }
      s.activePeriod = nextId;
    }
  }
  _cache.settings = normalizeSettings(s);
  if (IS_REMOTE()) {
    try { await remotePost("closePeriod", { period: periodId }); } catch(e) { console.error(e); }
  } else {
    saveStore(STORE_KEYS.SETTINGS, _cache.settings);
  }
}
async function reopenPeriodRemote(periodId) {
  // 마감된 반기를 다시 활성으로 (관리자만 수정 가능하게 하려면 setActivePeriod 로 대체 가능)
  return setActivePeriodRemote(periodId);
}

async function clearAllEvaluationsRemote() {
  _cache.evaluations = [];
  if (IS_REMOTE()) {
    await remotePost("clearEvaluations", null);
  } else {
    saveStore(STORE_KEYS.EVALUATIONS, []);

}

async function updateEvaluatorRemote(dept, round, fields) {
  // 캐시에 반영
  if (!_cache.evaluators[dept]) _cache.evaluators[dept] = {};
  _cache.evaluators[dept][round] = Object.assign(_cache.evaluators[dept][round] || {}, fields);
  if (IS_REMOTE()) {
    await remotePost("updateEvaluator", { dept, round, fields });
  } else {
    saveStore(STORE_KEYS.EVALUATORS, _cache.evaluators);
  }
}

/* ---- 가감점 (adjustments) ---- */
function getAllAdjustments()  { return _cache.adjustments || []; }
function getAdjustments(period) {
  const p = period || getActivePeriod();
  return getAllAdjustments().filter(a => (a.period || "2026-H1") === p);
}
// (period, dept, empName) 별 카테고리 합계
function getAdjustmentTotal(period, dept, empName) {
  return getAdjustments(period)
    .filter(a => a.dept === dept && a.empName === empName)
    .reduce((s, a) => s + (Number(a.points) || 0), 0);
}
// (period, dept, empName) 별 카테고리별 상세 { 근태: {points, reason}, ... }
function getAdjustmentDetail(period, dept, empName) {
  const out = {};
  getAdjustments(period)
    .filter(a => a.dept === dept && a.empName === empName)
    .forEach(a => { out[a.category] = { points: Number(a.points)||0, reason: a.reason||"", updatedBy: a.updatedBy||"", updatedAt: a.updatedAt||"" }; });
  return out;
}
async function bulkUpsertAdjustmentsRemote(list) {
  // 로컬 캐시 갱신
  const all = _cache.adjustments || [];
  list.forEach(item => {
    const idx = all.findIndex(x =>
      (x.period||"") === (item.period||"") &&
      x.dept === item.dept &&
      x.empName === item.empName &&
      x.category === item.category
    );
    if (idx >= 0) all[idx] = item; else all.push(item);
  });
  _cache.adjustments = all;
  if (IS_REMOTE()) {
    await remotePost("bulkUpsertAdjustments", list);
  } else {
    saveStore("hy_adjustments_v1", all);
  }
}

function esc(s) {
  if (s === undefined || s === null) return "";
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// 평가자 로그인 후 이동할 탭을 미리 지정해 두고 로그인 화면으로 이동
function startEvaluatorFlow(targetTab) {
  session.postLoginTab = targetTab;
  go("eval-login");
}

/* --- 평가자 로그인 --- */
function renderEvalLogin() {
  const evs = getEvaluators();
  const depts = Object.keys(evs);
  $app().innerHTML = `
    <div class="card" style="max-width:520px;margin:40px auto">
      <h2>평가자 로그인</h2>
      <div class="notice info">소속 부서와 차수를 선택한 후, 평가자 비밀번호를 입력해 주세요.</div>
      <div id="login-err"></div>
      <div style="margin-bottom:12px">
        <label>부서</label>
        <select id="login-dept">
          <option value="">— 선택 —</option>
          ${depts.map(d => `<option value="${esc(d)}">${esc(d)}</option>`).join("")}
        </select>
      </div>
      <div style="margin-bottom:12px">
        <label>평가 차수</label>
        <select id="login-round">
          <option value="">— 선택 —</option>
        </select>
      </div>
      <div style="margin-bottom:12px">
        <label>평가자 비밀번호</label>
        <input id="login-pw" type="password" autocomplete="off" placeholder="6자리 비밀번호"/>
      </div>
      <div class="flex between">
        <button class="secondary" onclick="go('home')">취소</button>
        <button onclick="tryEvalLogin()">로그인</button>
      </div>
    </div>
  `;
  const $dept = document.getElementById("login-dept");
  const $round = document.getElementById("login-round");
  $dept.addEventListener("change", () => {
    const d = $dept.value;
    const r = evs[d] || {};
    const opts = [`<option value="">— 선택 —</option>`];
    // 일반 부서 표시 순서: 1차 → 2차, 임원 풀: 1차(조규오) → 1차(임웅걸) → 2차(양정일)
    const order = ["1차","2차","3차-조규오","3차-임웅걸","4차"];
    order.forEach(k => {
      if (r[k]) {
        const info = r[k];
        const label = displayRound(k); // 3차-* → 1차, 4차 → 2차, 그 외 그대로
        opts.push(`<option value="${esc(k)}">${esc(label)} 평가자 (${esc(info.name)} ${esc(info.title)})</option>`);
      }
    });
    // 위 order 에 없는 기타 키도 혹시 모를 경우를 대비해 표시
    Object.keys(r).forEach(k => {
      if (!order.includes(k)) {
        const info = r[k];
        opts.push(`<option value="${esc(k)}">${esc(k)} 평가자 (${esc(info.name)} ${esc(info.title)})</option>`);
      }
    });
    $round.innerHTML = opts.join("");
  });
  document.getElementById("login-pw").addEventListener("keydown", e => {
    if (e.key === "Enter") tryEvalLogin();
  });
}

function tryEvalLogin() {
  const dept = document.getElementById("login-dept").value;
  const round = document.getElementById("login-round").value;
  const pw = document.getElementById("login-pw").value.trim();
  const errEl = document.getElementById("login-err");
  const evs = getEvaluators();
  if (!dept || !round) {
    errEl.innerHTML = `<div class="notice err">부서와 차수를 모두 선택해 주세요.</div>`;
    return;
  }
  const info = evs[dept] && evs[dept][round];
  if (!info) {
    errEl.innerHTML = `<div class="notice err">해당 차수 평가자가 등록되어 있지 않습니다.</div>`;
    return;
  }
  if (pw !== info.password) {
    errEl.innerHTML = `<div class="notice err">비밀번호가 일치하지 않습니다.</div>`;
    return;
  }
  session.evaluatorDept = dept;
  session.evaluatorRound = round;
  session.evaluatorName = `${info.name} ${info.title}`;
  // 대표이사(임원 4차)는 관리자 권한도 자동 부여
  if (dept === "임원" && round === "4차") {
    session.isAdmin = true;
  }
  // 인사/안전관리 담당자는 가감점 관리 화면으로 진입
  if (dept === "인사/안전관리") {
    return go("adj-admin");
  }
  go("eval-home");
}

// 현재 로그인한 평가자가 관리자 권한을 가지는지
function evaluatorHasAdminRight() {
  return session.evaluatorDept === "임원" && session.evaluatorRound === "4차";
}

function logoutEvaluator() {
  // 평가자 로그인 경로에서 얻은 관리자 권한도 함께 해제
  if (evaluatorHasAdminRight()) session.isAdmin = false;
  session.evaluatorDept = null;
  session.evaluatorRound = null;
  session.evaluatorName = null;
  session.selectedEmp = null;
  session.selectedEmpDept = null;
  go("home");
}

/* --- 평가자 홈 --- */
function renderEvalHome() {
  if (!session.evaluatorDept) return go("eval-login");
  const dept = session.evaluatorDept;
  const round = session.evaluatorRound;
  const activePeriod = getActivePeriod();
  const evals = getEvaluationsByPeriod(activePeriod);
  let targets;
  if (dept === "임원") {
    // 3차/4차 평가자 — EXEC_TARGETS 에 정의된 대상만 평가
    const specs = EXEC_TARGETS[round] || [];
    targets = specs
      .map(s => EMPLOYEES.find(e => e.dept === s.dept && e.name === s.name))
      .filter(Boolean);
  } else {
    // 부서 1차/2차 평가자 — 부서원 중 부장·이사(임원 평가 대상) 제외, 본인 제외
    const emps = EMPLOYEES.filter(e => e.dept === dept && !isExecEmp(e));
    targets = emps.filter(e => !(e.name === getCurrentEvaluatorName(dept, round)));
  }
  const doneMap = {};

    const ev = evals.find(x => x.dept===t.dept && x.empName===t.name && x.round===round);

  const titleRound = displayRound(round);
  const viewTabLabel = dept === "임원" ? "임원 평가 결과 보기" : "우리 부서 결과 보기";
  $app().innerHTML = `
    <div class="card">
      <div class="flex between">
        <div>
          <h2 style="margin:0">${esc(dept)} · ${esc(titleRound)} 평가자</h2>
          <div class="mini">로그인: ${esc(session.evaluatorName)}</div>
        </div>
        <div class="flex" style="gap:8px;flex-wrap:wrap;justify-content:flex-end;align-items:center">
          <span class="period-badge">🗓 ${esc(periodLabel(getActivePeriod()))} 평가 진행 중</span>
          ${evaluatorHasAdminRight() ? `<button class="small" onclick="go('admin-home')" title="전체 평가 내용을 확인할 수 있습니다">🛠 관리자 대시보드</button>` : ``}
          <button class="secondary small" onclick="logoutEvaluator()">로그아웃</button>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="tabs">
        <div class="tab ${initialTab==='list'?'active':''}" onclick="setEvalTab('list')">평가 대상자</div>
        <div class="tab ${initialTab==='view'?'active':''}" onclick="setEvalTab('view')">${esc(viewTabLabel)}</div>
      </div>
      <div id="eval-tab-body"></div>
    </div>
  `;
  if (initialTab === "view") {
    renderDeptResultsInline(dept, document.getElementById("eval-tab-body"));
  } else {
    renderEvalListTab(targets, doneMap);
  }
}

// 내부 라운드 키 → 사용자 표시 문자열
// 임원(부장·이사) 평가는 3차(부사장) → 1차, 4차(대표이사) → 2차 로 재라벨
function displayRound(round) {
  if (!round) return "";
  if (round === "3차-조규오" || round === "3차-임웅걸") return "1차";
  if (round === "4차") return "2차";
  return round;
}

function setEvalTab(which) {
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  const tabs = document.querySelectorAll(".tab");
  const dept = session.evaluatorDept;
  const round = session.evaluatorRound;
  if (which === "list") {
    tabs[0].classList.add("active");
    let targets;
    if (dept === "임원") {
      const specs = EXEC_TARGETS[round] || [];
      targets = specs
        .map(s => EMPLOYEES.find(e => e.dept === s.dept && e.name === s.name))
        .filter(Boolean);
    } else {
      targets = EMPLOYEES.filter(e => e.dept === dept && !isExecEmp(e))
        .filter(e => !(e.name === getCurrentEvaluatorName(dept, round)));
    }
    const evals = getEvaluationsByPeriod(getActivePeriod());
    const doneMap = {};
    targets.forEach(t => {
      doneMap[t.name] = !!evals.find(x => x.dept===t.dept && x.empName===t.name && x.round===round);
    });
    renderEvalListTab(targets, doneMap);
  } else {
    tabs[1].classList.add("active");
    renderDeptResultsInline(dept, document.getElementById("eval-tab-body"));
  }
}

function getCurrentEvaluatorName(dept, round) {
  const evs = getEvaluators();
  return evs[dept] && evs[dept][round] ? evs[dept][round].name : null;
}

function renderEvalListTab(targets, doneMap) {
  const body = document.getElementById("eval-tab-body");
  if (!targets.length) {
    body.innerHTML = `<div class="notice warn">평가 대상자가 없습니다.</div>`;
    return;
  }
  const isExec = session.evaluatorDept === "임원";
  const cards = targets.map(e => `
    <div class="emp-card" onclick="startEvalForm('${esc(e.dept)}','${esc(e.name)}')">
      <div class="name">${esc(e.name)} <span class="chip rank">${esc(e.rank)}</span></div>
      ${isExec ? `<div class="mini" style="font-weight:600;color:var(--primary)">${esc(e.dept)}</div>` : ""}
      <div class="mini">${esc(e.rankCategory)} 평가표</div>
      <div class="meta">
        <span>${esc(displayRound(session.evaluatorRound))} 평가</span>
        <span class="chip ${doneMap[e.name] ? 'done' : 'pending'}">
          ${doneMap[e.name] ? '제출완료' : '미작성'}
        </span>
      </div>
    </div>
  `).join("");
  body.innerHTML = `
    <div class="notice info">${isExec ? '임원 평가 대상자 카드를 클릭하면 평가표가 열립니다.' : '부서원 카드를 클릭하면 평가표가 열립니다.'} 제출 후에도 다시 저장할 수 있습니다.</div>
    <div class="employee-grid">${cards}</div>
  `;
}

function startEvalForm(dept, name) {
  session.selectedEmpDept = dept;
  session.selectedEmp = name;
  go("eval-form");
}

/* --- 평가 입력 폼 --- */
function renderEvalForm() {
  const round = session.evaluatorRound;
  const empName = session.selectedEmp;
  // 임원(3차/4차) 평가자는 다른 부서 직원을 평가하므로 empDept 를 별도 사용
  const empDept = session.selectedEmpDept || session.evaluatorDept;
  const emp = EMPLOYEES.find(e => e.dept === empDept && e.name === empName);
  if (!emp) return go("eval-home");
  const form = emp.rankCategory === "과장이상" ? FORM_MANAGER : FORM_STAFF;
  const activePeriod = getActivePeriod();
  const existing = getEvaluation(empDept, empName, round, activePeriod);
  $app().innerHTML = `
    <div class="card">
      <div class="flex between">
        <div>
          <h2 style="margin:0">${esc(form.title)}</h2>
          <div class="mini">${esc(empDept)} · ${esc(emp.name)} ${esc(emp.rank)} · ${esc(displayRound(round))} 평가자: ${esc(session.evaluatorName)} · <b>${esc(periodLabel(activePeriod))}</b></div>
        </div>
        <div class="flex" style="gap:8px">
          <span class="period-badge">🗓 ${esc(periodLabel(activePeriod))}</span>
          <button class="secondary small" onclick="go('eval-home')">← 목록</button>
        </div>
      </div>
    </div>
    <div class="card">
      ${existing ? `<div class="notice info">이미 <b>${esc(periodLabel(activePeriod))}</b>에 저장된 평가가 있습니다. 수정 후 다시 제출하면 갱신됩니다.</div>` : ""}
      <div id="form-err"></div>
      <form id="eval-form" onsubmit="event.preventDefault();submitEval();">
        <table class="eval-table">
          <thead>
            <tr>
              <th style="width:90px">평가영역</th>
              <th style="width:150px">평가 항목</th>
              <th>세부 내용</th>
              ${form.grades.map(g => `<th>${g}</th>`).join("")}
              <th style="width:70px">점수</th>
            </tr>
          </thead>
          <tbody>
            ${renderFormItems(form, existing)}
            <tr class="total-row">
              <td colspan="${3 + form.grades.length}">총점 (100점 만점)</td>
              <td id="total-score" style="text-align:center">0</td>
            </tr>
          </tbody>
        </table>
        <div style="margin-top:20px">
          <label>총평 / 코멘트</label>
          <textarea id="comment" placeholder="자유 기술">${esc(existing ? existing.comment : "")}</textarea>
        </div>
        <div class="flex between" style="margin-top:20px">
          <button class="secondary" type="button" onclick="go('eval-home')">취소</button>
          <button type="submit">${existing ? "수정 제출" : "제출"}</button>
        </div>
      </form>
    </div>
  `;
  attachFormHandlers(form);
  recalcTotal();
}

function renderFormItems(form, existing) {
  const rows = [];
  form.areas.forEach(area => {
    area.items.forEach((item, idx) => {
      const sel = existing && existing.scores ? existing.scores[item.id] : null;
      rows.push(`
        <tr>
          ${idx === 0 ? `<td class="area" rowspan="${area.items.length}">${esc(area.area)}</td>` : ""}
          <td class="item">${esc(item.name)}</td>
          <td class="desc">${esc(item.desc)}</td>
          ${item.scores.map((sc, i) => `
            <td style="text-align:center;padding:4px">
              <label class="score-cell ${sel===sc?'checked':''}" data-item="${item.id}" data-score="${sc}"
                     style="display:block;cursor:pointer;padding:8px 2px;border-radius:6px;font-size:12px;font-weight:700;
                            ${sel===sc?'background:var(--primary);color:#fff':''}">
                <div style="font-size:14px">${sc}</div>
              </label>
            </td>
          `).join("")}
          <td class="subtotal-cell" id="score-${item.id}">${sel ?? "-"}</td>
        </tr>
      `);
    });
  });
  return rows.join("");
}

function attachFormHandlers(form) {
  document.querySelectorAll(".score-cell").forEach(el => {
    el.addEventListener("click", () => {
      const item = el.dataset.item;
      const score = parseInt(el.dataset.score, 10);
      // 같은 행(item) 하이라이트 해제
      document.querySelectorAll(`.score-cell[data-item="${item}"]`).forEach(c => {
        c.classList.remove("checked");
        c.style.background = "";
        c.style.color = "";
      });
      el.classList.add("checked");
      el.style.background = "var(--primary)";
      el.style.color = "#fff";
      document.getElementById(`score-${item}`).textContent = score;
      recalcTotal();
    });
  });
}

function recalcTotal() {
  let total = 0;
  document.querySelectorAll(".subtotal-cell").forEach(c => {
    const v = parseInt(c.textContent, 10);
    if (!isNaN(v)) total += v;
  });
  const el = document.getElementById("total-score");
  if (el) el.textContent = total;
}

async function submitEval() {
  const round = session.evaluatorRound;
  const empName = session.selectedEmp;
  const empDept = session.selectedEmpDept || session.evaluatorDept;
  const emp = EMPLOYEES.find(e => e.dept === empDept && e.name === empName);
  const form = emp.rankCategory === "과장이상" ? FORM_MANAGER : FORM_STAFF;
  const activePeriod = getActivePeriod();
  // 안전장치: 활성 반기가 어떤 이유로든 마감 상태라면 제출 차단
  if (isPeriodClosed(activePeriod) && !session.isAdmin) {
    document.getElementById("form-err").innerHTML =
      `<div class="notice err">현재 반기가 마감된 상태입니다. 관리자에게 문의해 주세요.</div>`;
    window.scrollTo({top:0,behavior:"smooth"});
    return;
  }
  const scores = {};
  let missing = [];
  form.areas.forEach(area => {
    area.items.forEach(item => {
      const cell = document.getElementById(`score-${item.id}`);
      const v = parseInt(cell.textContent, 10);
      if (isNaN(v)) {
        missing.push(item.name);
      } else {
        scores[item.id] = v;
      }
    });
  });
  if (missing.length) {
    document.getElementById("form-err").innerHTML =
      `<div class="notice err">모든 항목을 평가해 주세요. 미평가 항목: ${missing.map(esc).join(", ")}</div>`;
    window.scrollTo({top:0,behavior:"smooth"});
    return;
  }
  const total = Object.values(scores).reduce((a,b)=>a+b,0);
  const comment = document.getElementById("comment").value;
  const ev = {
    dept: empDept, empName, empRank: emp.rank, rankCategory: emp.rankCategory,
    round,
    period: activePeriod,
    evaluatorName: session.evaluatorName,
    scores, total, comment,
    submittedAt: new Date().toISOString()
  };
  const btn = document.querySelector("#eval-form button[type=submit]");
  if (btn) { btn.disabled = true; btn.textContent = "저장 중…"; }
  try {
    await upsertEvaluation(ev);
    alert(`${empName} ${emp.rank} 평가가 저장되었습니다. (총점 ${total}점)`);
    go("eval-home");
  } catch (e) {
    document.getElementById("form-err").innerHTML =
      `<div class="notice err">서버 저장 실패: ${esc(e.message)}. 네트워크 상태를 확인해 주세요.</div>`;
    if (btn) { btn.disabled = false; btn.textContent = "제출"; }
    window.scrollTo({top:0,behavior:"smooth"});
  }
}

// 결과 조회에서 사용할 반기 결정 (사용자가 드롭다운으로 고른 값 우선)
function resolveViewPeriod() {
  return session.viewPeriod || getActivePeriod();
}

/* ==========================================================
 *  결과 조회 권한 (계정 유형별 컬럼 노출 제어)
 *  ----------------------------------------------------------
 *  role 종류:
 *    - "admin"      : 관리자 (전체)
 *    - "exec-2nd"   : 임원 2차 평가자 (양정일 대표이사)
 *    - "exec-1st"   : 임원 1차 평가자 (조규오·임웅걸 부사장)
 *    - "dept-2nd"   : 일반 부서 2차 평가자
 *    - "dept-1st"   : 일반 부서 1차 평가자
 *    - "guest"      : 그 외 (원칙적으로 결과 화면 접근 X)
 * ========================================================== */
function getViewerRole() {
  if (session.isAdmin) return "admin";
  if (session.evaluatorDept === "임원") {
    if (session.evaluatorRound === "4차") return "exec-2nd";
    if (session.evaluatorRound === "3차-조규오" || session.evaluatorRound === "3차-임웅걸") return "exec-1st";
  }
  if (session.evaluatorDept === "인사/안전관리") return "hr-safety";
  if (session.evaluatorDept && session.evaluatorRound === "1차") return "dept-1st";
  if (session.evaluatorDept && session.evaluatorRound === "2차") return "dept-2nd";
  return "guest";
}
// 컬럼/영역 표시 여부 헬퍼
function canSeeSecondScore(role) { return role !== "dept-1st"; }              // dept-1st 만 2차 숨김
function canSeeAverage(role)     { return role !== "dept-1st"; }              // dept-1st 는 평균도 무의미
function canSeeGrade(role)       { return role === "admin" || role === "exec-1st" || role === "exec-2nd"; }
function canSeeRank(role)        { return canSeeGrade(role); }                // 등급 볼 수 있어야 순위도 의미
function canSeeDistBar(role)     { return canSeeGrade(role); }                // S/A/B/C 분포 바 = 등급 정보
// 가감점(근태·안전·교육) 조정 결과 열람 권한
function canSeeAdjustment(role)       { return role === "admin" || role === "exec-1st" || role === "exec-2nd" || role === "hr-safety"; }
function canSeeAdjustmentReason(role) { return role === "admin" || role === "exec-1st" || role === "exec-2nd" || role === "hr-safety"; }
// 가감점 관리 화면 접근 권한
function canManageAdjustments(role)   { return role === "hr-safety" || role === "admin"; }
// 가감점 카테고리 (표시 순서 = 저장 순서)
const ADJ_CATEGORIES = ["근태", "안전", "교육"];
const ADJ_LIMIT = 3;  // 카테고리별 개인당 ±3점 상한

// 반기 드롭다운 UI 렌더링 (결과 조회 화면 공용)
function renderPeriodPickerBar(currentId) {
  const s = getSettings();
  const active = s.activePeriod;
  const opts = s.periods.map(p => {
    const label = periodLabel(p.id) + (p.id === active ? " · 진행 중" : (p.status === "closed" ? " · 마감" : ""));
    return `<option value="${esc(p.id)}"${p.id === currentId ? " selected" : ""}>${esc(label)}</option>`;
  }).join("");
  return `
    <div class="flex" style="gap:8px;align-items:center;margin:0 0 12px;flex-wrap:wrap">
      <span class="mini" style="color:var(--muted)">조회 반기</span>
      <select onchange="setViewPeriod(this.value)" style="padding:6px 10px;border:1px solid var(--border);border-radius:6px">${opts}</select>
      ${currentId !== active ? `<span class="chip" style="background:#f1f5f9;color:#475569;border:1px solid #cbd5e1">지난 반기 조회 중</span>` : `<span class="chip" style="background:#dcfce7;color:#166534;border:1px solid #86efac">진행 중</span>`}
    </div>
  `;
}

/* --- 평가자: 본인 부서 결과 조회 (인라인) --- */
function renderDeptResultsInline(dept, container) {
  if (dept === "임원") {
    return renderExecResultsInline(container);
  }
  const period = resolveViewPeriod();
  const role = getViewerRole();
  const emps = EMPLOYEES.filter(e => e.dept === dept && !isExecEmp(e));
  const results = computeDeptResults(dept, period);
  // 컬럼 노출 판정
  const showRank  = canSeeRank(role);
  const showSec   = canSeeSecondScore(role);
  const showAvg   = canSeeAverage(role);
  const showGrade = canSeeGrade(role);
  const showDist  = canSeeDistBar(role);
  const showAdj   = canSeeAdjustment(role);  // 조정점(가감점) 열 노출

  const headCells = [];
  if (showRank) headCells.push(`<th style="width:50px">순위</th>`);
  headCells.push(`<th>이름</th>`);
  headCells.push(`<th style="width:80px">직급</th>`);
  headCells.push(`<th style="width:80px">1차</th>`);
  if (showSec)   headCells.push(`<th style="width:80px">2차</th>`);
  if (showAvg)   headCells.push(`<th style="width:80px">원평균</th>`);
  if (showAdj)   headCells.push(`<th style="width:70px" title="근태+안전+교육 가감점 합계">조정</th>`);
  if (showAvg)   headCells.push(`<th style="width:80px">조정평균</th>`);
  if (showGrade) headCells.push(`<th style="width:80px">등급</th>`);
  const colSpan = headCells.length;

  const rows = results.map(r => {
    const tds = [];
    if (showRank) tds.push(`<td>${r.rankIndex}</td>`);
    tds.push(`<td><b>${esc(r.empName)}</b></td>`);
    tds.push(`<td>${esc(r.empRank)}</td>`);
    tds.push(`<td style="text-align:center">${r.score1 ?? "-"}</td>`);
    if (showSec)   tds.push(`<td style="text-align:center">${r.score2 ?? "-"}</td>`);
    if (showAvg)   tds.push(`<td style="text-align:center">${r.avg !== null ? r.avg.toFixed(1) : "-"}</td>`);
    if (showAdj) {
      const adj = r.adjustment || 0;
      const style = adj > 0 ? "color:#059669;font-weight:700"
                    : adj < 0 ? "color:#dc2626;font-weight:700"
                    : "color:var(--muted)";
      tds.push(`<td style="text-align:center;${style}">${adj > 0 ? "+" + adj : (adj === 0 ? "0" : adj)}</td>`);
    }
    if (showAvg)   tds.push(`<td style="text-align:center"><b>${r.avgAdjusted !== null ? r.avgAdjusted.toFixed(1) : "-"}</b></td>`);
    if (showGrade) tds.push(`<td style="text-align:center">${r.grade ? `<span class="chip ${r.grade.toLowerCase()}">${r.grade}</span>` : "-"}</td>`);
    return `<tr>${tds.join("")}</tr>`;
  }).join("");

  const dist = gradeDistribution(results);
  const submittedCount = results.filter(r => r.avg !== null).length;

  // stat 박스: 대상/제출은 항상, 평균은 dept-1st 만 숨김
  const statBoxes = [
    `<div class="stat-box"><div class="label">평가 대상</div><div class="value">${emps.length}명</div></div>`,
    `<div class="stat-box"><div class="label">제출 완료</div><div class="value">${submittedCount}</div></div>`
  ];
  if (showAvg) {
    statBoxes.push(`<div class="stat-box"><div class="label">부서 평균</div><div class="value">${deptAverage(results)}</div></div>`);
  }

  // 안내 문구는 계정별로 살짝 다르게
  let noticeText;
  if (role === "dept-1st") {
    noticeText = `우리 부서 (<b>${esc(dept)}</b>) 의 <b>${esc(periodLabel(period))}</b> · <b>1차 평가자 열람 화면</b>입니다. 본인이 매긴 <b>1차 점수만</b> 확인 가능하며, 2차/평균/등급은 표시되지 않습니다.`;
  } else if (role === "dept-2nd") {
    noticeText = `우리 부서 (<b>${esc(dept)}</b>) 의 <b>${esc(periodLabel(period))}</b> · <b>2차 평가자 열람 화면</b>입니다. 1차/2차 점수와 부서 평균까지 확인할 수 있습니다. 최종 등급은 관리자만 열람합니다.`;
  } else {
    noticeText = `우리 부서 (<b>${esc(dept)}</b>) 의 <b>${esc(periodLabel(period))}</b> 평가 결과입니다.`;
  }

  container.innerHTML = `
    ${renderPeriodPickerBar(period)}
    <div class="notice info">${noticeText}</div>
    <div class="stat-grid">${statBoxes.join("")}</div>
    ${showDist ? `
      <div>
        <h3>부서 내 S/A/B/C 분포</h3>
        <div class="mini" style="margin-bottom:6px">등급 산정: ${esc(gradingModeLabel(results))}</div>
        ${renderDistBar(dist)}
      </div>
    ` : ``}
    <div style="margin-top:20px">
      <table>
        <thead><tr>${headCells.join("")}</tr></thead>
        <tbody>${rows || `<tr><td colspan="${colSpan}" style="text-align:center" class="muted">아직 결과가 없습니다.</td></tr>`}</tbody>
      </table>
    </div>
  `;
}

/* --- 인사/안전관리 담당자: 가감점 관리 화면 --- */
// 편집 중인 값을 담아두는 세션 저장소 (page state)
function _adjEditKey(dept, name, cat) { return dept + "|" + name + "|" + cat; }

  const role = getViewerRole();
  // 편집 상태 초기화 (첫 진입 or 반기 변경 시)
  if (!session.__adjEdits || session.__adjEditsPeriod !== period) {
    session.__adjEdits = {};
    session.__adjEditsPeriod = period;
  }

  // 대상: 일반 직원(임원 대상 제외)
  const targets = EMPLOYEES.filter(e => !isExecEmp(e));
  const allDepts = [...new Set(targets.map(e => e.dept))];

  // 필터 상태
  if (session.__adjFilterDept == null) session.__adjFilterDept = "";
  if (session.__adjFilterSearch == null) session.__adjFilterSearch = "";
  if (session.__adjFilterOnlyChanged == null) session.__adjFilterOnlyChanged = false;

  $app().innerHTML = `
    <div class="card">
      <div class="flex between" style="flex-wrap:wrap;gap:10px">
        <div>
          <h2 style="margin:0">근태·안전·교육 가감점 관리</h2>
          <div class="mini">로그인: ${esc(session.evaluatorName || "담당자")} · 카테고리별 개인당 ±${ADJ_LIMIT}점 상한</div>
        </div>
        <div class="flex" style="gap:8px;flex-wrap:wrap;align-items:center">
          <span class="period-badge">🗓 ${esc(periodLabel(period))}</span>
          <button id="adj-save-btn" onclick="saveAdjustmentEdits()">💾 변경사항 저장 (<span id="adj-dirty-count">0</span>)</button>
          <button class="secondary small" onclick="logoutEvaluator()">로그아웃</button>

    </div>

    <div class="card">

        <select id="adj-dept" onchange="onAdjFilterChange()" style="max-width:200px">

        </select>

          <input id="adj-onlychanged" type="checkbox" ${session.__adjFilterOnlyChanged ? "checked" : ""} onchange="onAdjFilterChange()" style="width:auto"/>

        </label>
        <span id="adj-count" class="mini" style="margin-left:auto"></span>
      </div>
      <div style="overflow-x:auto">
        <table id="adj-table" class="adj-table">
          <thead>
            <tr>
              <th style="width:100px">부서</th>
              <th style="width:80px">이름</th>
              <th style="width:60px">직급</th>
              ${ADJ_CATEGORIES.map(c => `<th style="min-width:230px">${esc(c)} (±${ADJ_LIMIT})</th>`).join("")}
              <th style="width:60px">합계</th>
            </tr>
          </thead>
          <tbody id="adj-tbody"></tbody>
        </table>
      </div>
      <div id="adj-msg" class="mini" style="margin-top:10px;color:var(--muted)"></div>
    </div>
  `;
  renderAdjustmentTableBody();
}

function renderAdjustmentTableBody() {
  const period = getActivePeriod();
  const filterDept = session.__adjFilterDept || "";
  const searchText = (session.__adjFilterSearch || "").trim();
  const onlyChanged = !!session.__adjFilterOnlyChanged;
  const targets = EMPLOYEES.filter(e => !isExecEmp(e));

  // 각 직원에 대해 현재값 (편집 중이거나 서버 저장값)
  function currentValue(dept, name, cat, field) {
    const key = _adjEditKey(dept, name, cat);
    if (session.__adjEdits[key] && field in session.__adjEdits[key]) {
      return session.__adjEdits[key][field];
    }
    const detail = getAdjustmentDetail(period, dept, name)[cat];
    if (detail) return field === "points" ? detail.points : detail.reason;
    return field === "points" ? 0 : "";
  }
  function isChanged(emp) {
    return ADJ_CATEGORIES.some(cat => currentValue(emp.dept, emp.name, cat, "points") !== 0 || currentValue(emp.dept, emp.name, cat, "reason").trim() !== "");
  }

  const filtered = targets.filter(e => {
    if (filterDept && e.dept !== filterDept) return false;
    if (searchText && !e.name.includes(searchText)) return false;
    if (onlyChanged && !isChanged(e)) return false;
    return true;
  });

  const rows = filtered.map(emp => {
    const catCells = ADJ_CATEGORIES.map(cat => {
      const pts = currentValue(emp.dept, emp.name, cat, "points");
      const reason = currentValue(emp.dept, emp.name, cat, "reason");
      const editKey = _adjEditKey(emp.dept, emp.name, cat);
      return `
        <td>
          <div class="flex" style="gap:4px;align-items:center">
            <input type="number" min="-${ADJ_LIMIT}" max="${ADJ_LIMIT}" step="1" value="${pts}"
              style="width:56px;text-align:center;padding:4px 6px"
              onchange="onAdjPointsChange('${esc(emp.dept)}','${esc(emp.name)}','${esc(cat)}',this.value)"/>
            <input type="text" value="${esc(reason)}" placeholder="사유 (선택)"
              style="flex:1;padding:4px 8px;font-size:12px"
              oninput="onAdjReasonChange('${esc(emp.dept)}','${esc(emp.name)}','${esc(cat)}',this.value)"/>
          </div>
        </td>`;
    }).join("");
    const sum = ADJ_CATEGORIES.reduce((s, c) => s + (Number(currentValue(emp.dept, emp.name, c, "points")) || 0), 0);
    const sumStyle = sum > 0 ? "color:#059669;font-weight:700"
                    : sum < 0 ? "color:#dc2626;font-weight:700"
                    : "color:var(--muted)";
    return `
      <tr data-empkey="${esc(emp.dept)}||${esc(emp.name)}">
        <td>${esc(emp.dept)}</td>
        <td><b>${esc(emp.name)}</b></td>
        <td>${esc(emp.rank)}</td>
        ${catCells}
        <td style="text-align:center;${sumStyle}">${sum > 0 ? "+" + sum : sum}</td>
      </tr>`;
  }).join("");

  const tbody = document.getElementById("adj-tbody");
  if (tbody) tbody.innerHTML = rows || `<tr><td colspan="${3 + ADJ_CATEGORIES.length + 1}" style="text-align:center" class="muted">조건에 해당하는 직원이 없습니다.</td></tr>`;
  const cntEl = document.getElementById("adj-count");
  if (cntEl) cntEl.textContent = `${filtered.length} / ${targets.length}명 표시`;
  updateAdjDirtyCount();
}

function onAdjFilterChange() {
  session.__adjFilterSearch = document.getElementById("adj-search").value;
  session.__adjFilterDept   = document.getElementById("adj-dept").value;
  session.__adjFilterOnlyChanged = document.getElementById("adj-onlychanged").checked;
  renderAdjustmentTableBody();
}

function onAdjPointsChange(dept, name, cat, val) {
  const key = _adjEditKey(dept, name, cat);
  let n = parseInt(val, 10);
  if (isNaN(n)) n = 0;
  if (n > ADJ_LIMIT) n = ADJ_LIMIT;
  if (n < -ADJ_LIMIT) n = -ADJ_LIMIT;
  if (!session.__adjEdits[key]) session.__adjEdits[key] = {};
  session.__adjEdits[key].points = n;
  // 즉시 재렌더 (합계 컬럼 갱신)
  renderAdjustmentTableBody();
}

function onAdjReasonChange(dept, name, cat, val) {
  const key = _adjEditKey(dept, name, cat);
  if (!session.__adjEdits[key]) session.__adjEdits[key] = {};
  session.__adjEdits[key].reason = String(val || "");
  updateAdjDirtyCount();
}

function updateAdjDirtyCount() {
  const period = getActivePeriod();
  let dirty = 0;
  Object.keys(session.__adjEdits || {}).forEach(k => {
    const [dept, name, cat] = k.split("|");
    const edit = session.__adjEdits[k];
    const cur = getAdjustmentDetail(period, dept, name)[cat] || { points: 0, reason: "" };
    const editedPts    = ("points" in edit) ? edit.points : cur.points;
    const editedReason = ("reason" in edit) ? edit.reason : cur.reason;
    if (editedPts !== cur.points || editedReason.trim() !== (cur.reason||"").trim()) dirty++;
  });
  const el = document.getElementById("adj-dirty-count");
  if (el) el.textContent = dirty;
}

async function saveAdjustmentEdits() {
  const period = getActivePeriod();
  const now = new Date().toISOString();
  const updatedBy = session.evaluatorName || "인사/안전관리";
  const list = [];
  Object.keys(session.__adjEdits || {}).forEach(k => {
    const [dept, name, cat] = k.split("|");
    const edit = session.__adjEdits[k];
    const cur = getAdjustmentDetail(period, dept, name)[cat] || { points: 0, reason: "" };
    const pts    = ("points" in edit) ? edit.points : cur.points;
    const reason = ("reason" in edit) ? edit.reason : cur.reason;
    // 변경사항만 전송
    if (pts !== cur.points || reason.trim() !== (cur.reason||"").trim()) {
      list.push({ period, dept, empName: name, category: cat, points: pts, reason, updatedBy, updatedAt: now });
    }
  });
  if (!list.length) {
    document.getElementById("adj-msg").innerHTML = `<span style="color:var(--warn)">변경 사항 없음</span>`;
    return;
  }
  const btn = document.getElementById("adj-save-btn");
  if (btn) { btn.disabled = true; btn.textContent = "저장 중…"; }
  try {
    await bulkUpsertAdjustmentsRemote(list);
    session.__adjEdits = {};
    document.getElementById("adj-msg").innerHTML = `<span style="color:var(--accent)">✅ ${list.length}건 저장 완료</span>`;
    renderAdjustmentTableBody();
  } catch (e) {
    document.getElementById("adj-msg").innerHTML = `<span style="color:var(--danger)">저장 실패: ${esc(e.message)}</span>`;
  } finally {
    if (btn) { btn.disabled = false; btn.innerHTML = `💾 변경사항 저장 (<span id="adj-dirty-count">0</span>)`; }
    updateAdjDirtyCount();
  }
}

let _chartLibLoading = null;
function ensureChartJs() {
  if (window.Chart) return Promise.resolve();
  if (_chartLibLoading) return _chartLibLoading;
  _chartLibLoading = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js";
    s.onload = () => resolve();
    s.onerror = () => reject(new Error("Chart.js 로드 실패"));
    document.head.appendChild(s);
  });
  return _chartLibLoading;
}

// 정규식용 이스케이프 (반기 id 안전)
function escRegex(s) { return String(s).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

function cmpChangePeriod(which, v) {
  if (which === "A") session._cmpA = v; else session._cmpB = v;
  renderAdminCompare(document.getElementById("admin-body"));
}

function _collectPeriodResults(periodId) {
  const depts = [...new Set(EMPLOYEES.filter(e => !isExecEmp(e)).map(e => e.dept))];
  const dept = {};
  depts.forEach(d => { dept[d] = computeDeptResults(d, periodId); });
  const exec = computeExecResults(periodId);
  const dist = { S:0, A:0, B:0, C:0 };
  const empGrade = {};
  Object.entries(dept).forEach(([d, rows]) => {
    rows.forEach(r => {
      if (r.grade) dist[r.grade] = (dist[r.grade]||0) + 1;
      if (r.grade) empGrade[d + "|" + r.empName] = r.grade;
    });
  });
  exec.forEach(r => {
    if (r.grade) dist[r.grade] = (dist[r.grade]||0) + 1;
    if (r.grade) empGrade[r.dept + "|" + r.empName] = r.grade;
  });
  return { dept, exec, dist, empGrade };
}

let _cmpCharts = { avg: null, distA: null, distB: null };
function renderCompareCharts() {
  const a = session._cmpA, b = session._cmpB;
  const A = _collectPeriodResults(a);
  const B = _collectPeriodResults(b);
  const depts = Object.keys(A.dept);
  const avgA = depts.map(d => {
    const vals = A.dept[d].map(r => r.avg).filter(v => v!==null);
    return vals.length ? vals.reduce((x,y)=>x+y,0)/vals.length : 0;
  });
  const avgB = depts.map(d => {
    const vals = B.dept[d].map(r => r.avg).filter(v => v!==null);
    return vals.length ? vals.reduce((x,y)=>x+y,0)/vals.length : 0;
  });
  // 임원 평균도 함께
  const execAvgA = (() => { const v = A.exec.map(r=>r.avg).filter(x=>x!==null); return v.length ? v.reduce((x,y)=>x+y,0)/v.length : 0; })();
  const execAvgB = (() => { const v = B.exec.map(r=>r.avg).filter(x=>x!==null); return v.length ? v.reduce((x,y)=>x+y,0)/v.length : 0; })();
  const labels = depts.concat(["임원 풀"]);
  const dataA = avgA.concat([execAvgA]);
  const dataB = avgB.concat([execAvgB]);

  if (_cmpCharts.avg) _cmpCharts.avg.destroy();
  _cmpCharts.avg = new Chart(document.getElementById("cmp-chart-avg").getContext("2d"), {
    type: "bar",
    data: {
      labels,
      datasets: [
        { label: periodLabel(a), data: dataA.map(x=>Number(x.toFixed(1))), backgroundColor: "#1e3a8a" },
        { label: periodLabel(b), data: dataB.map(x=>Number(x.toFixed(1))), backgroundColor: "#f59e0b" }
      ]
    },
    options: { responsive: true, scales: { y: { beginAtZero: true, max: 100 } } }
  });

  const distCfg = (dist, color) => ({
    type: "doughnut",
    data: {
      labels: ["S","A","B","C"],
      datasets: [{ data: [dist.S, dist.A, dist.B, dist.C], backgroundColor: color }]
    },
    options: { responsive: true }
  });
  const colors = ["#0ea5e9","#22c55e","#f59e0b","#ef4444"];
  if (_cmpCharts.distA) _cmpCharts.distA.destroy();
  if (_cmpCharts.distB) _cmpCharts.distB.destroy();
  _cmpCharts.distA = new Chart(document.getElementById("cmp-chart-distA").getContext("2d"), distCfg(A.dist, colors));
  _cmpCharts.distB = new Chart(document.getElementById("cmp-chart-distB").getContext("2d"), distCfg(B.dist, colors));

  // 사원별 등급 변화 표
  const keys = new Set([...Object.keys(A.empGrade), ...Object.keys(B.empGrade)]);
  const rows = [];
  keys.forEach(k => {
    const [dept, name] = k.split("|");
    const emp = EMPLOYEES.find(e => e.dept === dept && e.name === name);
    if (!emp) return;
    const gA = A.empGrade[k] || "-";
    const gB = B.empGrade[k] || "-";
    let arrow = "";
    if (gA !== "-" && gB !== "-") {
      const order = { S:4, A:3, B:2, C:1, "-":0 };
      if (order[gB] > order[gA]) arrow = "↑ 상승";
      else if (order[gB] < order[gA]) arrow = "↓ 하락";
      else arrow = "= 유지";
    } else if (gB !== "-") arrow = "🆕 신규";
    else arrow = "○ 미제출";
    rows.push({ dept, name, rank: emp.rank, gA, gB, arrow });
  });
  rows.sort((x,y) => x.dept.localeCompare(y.dept) || x.name.localeCompare(y.name));
  const tbody = document.querySelector("#cmp-table tbody");
  tbody.innerHTML = rows.map(r => `
    <tr>
      <td>${esc(r.dept)}</td>
      <td>${esc(r.name)}</td>
      <td>${esc(r.rank)}</td>
      <td>${r.gA !== "-" ? `<span class="chip ${r.gA.toLowerCase()}">${r.gA}</span>` : `<span class="muted">-</span>`}</td>
      <td>${r.gB !== "-" ? `<span class="chip ${r.gB.toLowerCase()}">${r.gB}</span>` : `<span class="muted">-</span>`}</td>
      <td>${esc(r.arrow)}</td>
    </tr>
  `).join("") || `<tr><td colspan="6" style="text-align:center" class="muted">비교할 데이터가 없습니다.</td></tr>`;
}

  const newPw2 = document.getElementById("sec-new2").value;
  if (!oldPw || !newPw || !newPw2) {
    errEl.innerHTML = `<div class="notice err">모든 칸을 입력해 주세요.</div>`;
    return;
  }
  if (oldPw !== getAdminPassword()) {
    errEl.innerHTML = `<div class="notice err">현재 비밀번호가 일치하지 않습니다.</div>`;
    return;
  }
  if (newPw.length < 6) {
    errEl.innerHTML = `<div class="notice err">새 비밀번호는 6자 이상이어야 합니다.</div>`;
    return;
  }
  if (newPw !== newPw2) {
    errEl.innerHTML = `<div class="notice err">새 비밀번호 확인이 일치하지 않습니다.</div>`;
    return;
  }
  if (newPw === oldPw) {
    errEl.innerHTML = `<div class="notice err">기존 비밀번호와 동일합니다. 다른 값을 사용해 주세요.</div>`;
    return;
  }
  setAdminPassword(newPw);
  errEl.innerHTML = `<div class="notice ok">관리자 비밀번호가 변경되었습니다.</div>`;
  document.getElementById("sec-old").value = "";
  document.getElementById("sec-new").value = "";
  document.getElementById("sec-new2").value = "";
  setTimeout(() => renderAdminSecurity(document.getElementById("admin-body")), 800);
}

function resetAdminPassword() {
  if (!confirm("관리자 비밀번호를 초기 비밀번호로 되돌릴까요?\n(현재 이 브라우저에 저장된 비밀번호가 지워집니다.)")) return;
  try { localStorage.removeItem(ADMIN_PW_KEY); } catch(e) {}
  renderAdminSecurity(document.getElementById("admin-body"));
  alert("초기 비밀번호로 복구되었습니다.");
}

function renderAdminResults(body) {
  const period = resolveViewPeriod();
  const depts = [...new Set(EMPLOYEES.filter(e => !isExecEmp(e)).map(e => e.dept))];
  const all = [];
  depts.forEach(d => {
    computeDeptResults(d, period).forEach(r => all.push({ ...r, dept: d }));
  });
  const byDept = {};
  depts.forEach(d => byDept[d] = all.filter(r => r.dept === d));
  const execResults = computeExecResults(period);
  const execAll = execResults.map(r => ({ ...r }));

  const regularCount = EMPLOYEES.filter(e => !isExecEmp(e)).length;
  const execCount = EMPLOYEES.filter(isExecEmp).length;
  const totalCount = regularCount + execCount;
  const submittedCount = all.filter(r => r.avg !== null).length + execAll.filter(r => r.avg !== null).length;
  const overallAvg = (() => {
    const vals = [...all, ...execAll].map(r=>r.avg).filter(v => v !== null);
    if (!vals.length) return "-";
    return (vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1);
  })();

  body.innerHTML = `
    ${renderPeriodPickerBar(period)}
    <div class="stat-grid">
      <div class="stat-box"><div class="label">조회 반기</div><div class="value" style="font-size:16px">${esc(periodLabel(period))}</div></div>
      <div class="stat-box"><div class="label">전체 대상자</div><div class="value">${totalCount}명 <span class="mini">(일반 ${regularCount} · 임원 ${execCount})</span></div></div>
      <div class="stat-box"><div class="label">제출 완료</div><div class="value">${submittedCount}</div></div>
      <div class="stat-box"><div class="label">전체 평균</div><div class="value">${overallAvg}</div></div>
    </div>
    ${depts.map(d => renderDeptResultTable(d, byDept[d])).join("")}
    ${renderExecResultTable(execResults)}
  `;
}

function toggleAllPw() {
  document.querySelectorAll("[id^='pw-']").forEach(el => {
    if (el.classList.contains("pw-view")) {
      el.classList.remove("pw-view");
      el.classList.add("pw-hidden");
      el.textContent = "●●●●●●";
    } else {
      el.classList.add("pw-view");
      el.classList.remove("pw-hidden");
      el.textContent = el.dataset.val;
    }
  });
}

function randomPw() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let s = "";
  for (let i=0;i<6;i++) s += chars[Math.floor(Math.random()*chars.length)];
  return s;
}

async function regenPw(dept, round) {
  if (!confirm(`${dept} ${round} 평가자의 비밀번호를 새로 발급하시겠습니까?`)) return;
  const np = randomPw();
  try {
    await updateEvaluatorRemote(dept, round, { password: np });
    alert(`새 비밀번호: ${np}`);
    renderAdminAccounts(document.getElementById("admin-body"));
  } catch (e) {
    alert("비밀번호 재발급 실패: " + e.message);
  }
}

function exportAccountsCsv() {
  const evs = getEvaluators();
  const rows = [["부서","차수","평가자","직위","비밀번호"]];
  const roundOrder = ["1차","2차","3차-조규오","3차-임웅걸","4차"];
  Object.entries(evs).forEach(([dept, info]) => {
    roundOrder.forEach(r => {
      if (info[r]) {
        const label = r.startsWith("3차-") ? `1차 (${r.slice(3)})` : (r === "4차" ? "2차" : r);
        rows.push([dept, label, info[r].name, info[r].title, info[r].password]);
      }
    });
    Object.keys(info).forEach(r => {
      if (!roundOrder.includes(r)) {
        rows.push([dept, r, info[r].name, info[r].title, info[r].password]);
      }
    });
  });
  const csv = "\uFEFF" + rows.map(r => r.map(v => `"${String(v).replaceAll('"','""')}"`).join(",")).join("\n");
  const blob = new Blob([csv], { type: "text/csv" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `평가자_계정_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

/* ========== 엑셀 업로드 / 내보내기 / 템플릿 ========== */

function ensureSheetJS() {
  if (typeof XLSX === "undefined") {
    alert("엑셀 처리 라이브러리(SheetJS)가 로드되지 않았습니다. 인터넷 연결을 확인한 뒤 페이지를 새로고침 해주세요.");
    return false;
  }
  return true;
}

function downloadUploadTemplate() {
  if (!ensureSheetJS()) return;
  const header = ["부서","이름","직급","1차점수","2차점수","1차평가자","2차평가자","1차코멘트","2차코멘트"];
  const rows = [header];
  const evs = getEvaluators();
  // 부장·이사(임원 평가 대상)는 1차/2차 템플릿에서 제외 — 3차/4차는 웹으로만 제출
  EMPLOYEES.filter(e => !isExecEmp(e)).forEach(e => {
    const round1Name = evs[e.dept] && evs[e.dept]["1차"] ? `${evs[e.dept]["1차"].name} ${evs[e.dept]["1차"].title}` : "";
    const round2Name = evs[e.dept] && evs[e.dept]["2차"] ? `${evs[e.dept]["2차"].name} ${evs[e.dept]["2차"].title}` : "";
    // 평가자 본인 행은 해당 차수의 점수칸을 공란 처리(자기 자신 평가 X)
    const is1selfEmp = evs[e.dept] && evs[e.dept]["1차"] && evs[e.dept]["1차"].name === e.name;
    const is2selfEmp = evs[e.dept] && evs[e.dept]["2차"] && evs[e.dept]["2차"].name === e.name;
    rows.push([
      e.dept, e.name, e.rank,
      is1selfEmp ? "" : "",   // 점수는 사용자가 입력
      is2selfEmp ? "" : "",
      is1selfEmp ? "-" : round1Name,
      is2selfEmp ? "-" : round2Name,
      "", ""
    ]);
  });
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws["!cols"] = [
    {wch:14},{wch:10},{wch:8},{wch:10},{wch:10},{wch:18},{wch:18},{wch:30},{wch:30}
  ];
  // 안내 시트 추가
  const guide = XLSX.utils.aoa_to_sheet([
    ["한양전공 인사평가 — 업로드 템플릿 사용 안내"],
    [],

// 전역 임시 저장: 업로드 미리보기 → 확정 반영
let _uploadPending = null;

function handleEvaluationUpload(event) {
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  document.getElementById("upload-filename").textContent = file.name;
  if (!ensureSheetJS()) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, { type: "array" });
      // '평가결과' 시트 우선, 없으면 첫 번째 시트
      const sheetName = wb.SheetNames.includes("평가결과") ? "평가결과" : wb.SheetNames[0];
      const ws = wb.Sheets[sheetName];
      const json = XLSX.utils.sheet_to_json(ws, { defval: "" });
      processUploadRows(json);
    } catch (err) {
      console.error(err);
      document.getElementById("upload-preview").innerHTML =
        `<div class="notice err">파일을 읽는 중 오류가 발생했습니다: ${esc(err.message)}</div>`;
    }
  };
  reader.readAsArrayBuffer(file);
  // 동일 파일 재업로드 허용
  event.target.value = "";
}

function normalizeHeader(key) {
  return String(key).replace(/\s+/g,"").replace(/[()（）]/g,"").toLowerCase();
}

function pickValue(row, candidates) {
  // candidates: 정규화된 키 후보
  for (const k of Object.keys(row)) {
    const n = normalizeHeader(k);
    if (candidates.includes(n)) return row[k];
  }
  return undefined;
}

function parseScore(v) {
  if (v === "" || v === null || v === undefined) return null;
  const n = Number(String(v).replace(/[^\d.-]/g,""));
  if (!isFinite(n)) return null;
  if (n < 0 || n > 100) return null;
  return n;
}

function processUploadRows(rows) {
  const preview = [];
  const errors = [];
  const ok = [];
  rows.forEach((row, idx) => {
    const dept = String(pickValue(row, ["부서"]) ?? "").trim();
    const name = String(pickValue(row, ["이름","성명"]) ?? "").trim();
    if (!dept && !name) return; // 빈 행
    const rank = String(pickValue(row, ["직급"]) ?? "").trim();
    const s1 = parseScore(pickValue(row, ["1차점수","1차총점","1차"]));
    const s2 = parseScore(pickValue(row, ["2차점수","2차총점","2차"]));
    const eval1Name = String(pickValue(row, ["1차평가자"]) ?? "").trim();
    const eval2Name = String(pickValue(row, ["2차평가자"]) ?? "").trim();
    const comment1 = String(pickValue(row, ["1차코멘트","1차총평"]) ?? "").trim();
    const comment2 = String(pickValue(row, ["2차코멘트","2차총평"]) ?? "").trim();

    const emp = EMPLOYEES.find(e => e.dept === dept && e.name === name);
    if (!emp) {
      errors.push({ row: idx + 2, dept, name, reason: "등록된 직원과 일치하지 않습니다" });
      return;
    }
    if (isExecEmp(emp)) {
      errors.push({ row: idx + 2, dept, name, reason: "부장·이사는 일반 1차/2차 업로드 대상이 아닙니다. 임원 평가(부사장·대표이사)는 웹 화면에서만 제출됩니다." });
      return;
    }
    if (s1 === null && s2 === null) {
      errors.push({ row: idx + 2, dept, name, reason: "1차/2차 점수가 모두 비어있거나 범위(0~100)를 벗어났습니다" });
      return;
    }
    const evs = getEvaluators();
    const defaultEval1 = evs[dept] && evs[dept]["1차"] ? `${evs[dept]["1차"].name} ${evs[dept]["1차"].title}` : "업로드";
    const defaultEval2 = evs[dept] && evs[dept]["2차"] ? `${evs[dept]["2차"].name} ${evs[dept]["2차"].title}` : "업로드";
    ok.push({
      dept, empName: name, empRank: emp.rank, rankCategory: emp.rankCategory,
      s1, s2,
      eval1Name: eval1Name || defaultEval1,
      eval2Name: eval2Name || defaultEval2,
      comment1, comment2
    });
    preview.push({ dept, name, rank: emp.rank, s1, s2, eval1Name: eval1Name || defaultEval1, eval2Name: eval2Name || defaultEval2 });
  });

  _uploadPending = ok;

  const box = document.getElementById("upload-preview");
  const summary = `
    <div class="stat-grid">
      <div class="stat-box"><div class="label">반영 예정</div><div class="value">${ok.length}건</div></div>
      <div class="stat-box"><div class="label">오류 / 건너뜀</div><div class="value">${errors.length}건</div></div>
      <div class="stat-box"><div class="label">총 행 수</div><div class="value">${rows.length}</div></div>
    </div>
  `;
  const previewRows = preview.slice(0, 100).map(r => `
    <tr>
      <td>${esc(r.dept)}</td>
      <td>${esc(r.name)}</td>
      <td>${esc(r.rank)}</td>
      <td style="text-align:center">${r.s1 ?? '<span class="muted">-</span>'}</td>
      <td style="text-align:center">${r.s2 ?? '<span class="muted">-</span>'}</td>
      <td>${esc(r.eval1Name)}</td>
      <td>${esc(r.eval2Name)}</td>
    </tr>
  `).join("");
  const errorsRows = errors.slice(0, 50).map(er => `
    <tr>
      <td>${er.row}</td>
      <td>${esc(er.dept)}</td>
      <td>${esc(er.name)}</td>
      <td style="color:var(--danger)">${esc(er.reason)}</td>
    </tr>
  `).join("");
  box.innerHTML = `
    ${summary}
    ${ok.length ? `
      <div class="flex" style="gap:10px;margin-bottom:10px">
        <button onclick="confirmUploadApply()">확정 반영 (${ok.length}건)</button>
        <button class="secondary" onclick="cancelUpload()">취소</button>
      </div>
    ` : `<div class="notice warn">반영할 수 있는 유효한 행이 없습니다.</div>`}
    ${preview.length ? `
      <h3>반영 미리보기${preview.length > 100 ? ` (상위 100행)` : ''}</h3>
      <div style="overflow-x:auto">
      <table>
        <thead><tr><th>부서</th><th>이름</th><th>직급</th><th>1차점수</th><th>2차점수</th><th>1차평가자</th><th>2차평가자</th></tr></thead>
        <tbody>${previewRows}</tbody>
      </table>
      </div>
    ` : ''}
    ${errors.length ? `
      <h3 style="margin-top:20px;color:var(--danger)">오류 / 건너뛴 행</h3>
      <div style="overflow-x:auto">
      <table>
        <thead><tr><th>행</th><th>부서</th><th>이름</th><th>사유</th></tr></thead>
        <tbody>${errorsRows}</tbody>
      </table>
      </div>
    ` : ''}
  `;
}

async function confirmUploadApply() {
  if (!_uploadPending || !_uploadPending.length) return;
  const activePeriod = getActivePeriod();
  if (isPeriodClosed(activePeriod)) {
    alert("현재 반기가 마감된 상태입니다. 반기 관리에서 활성 반기를 다시 지정한 뒤 업로드해 주세요.");
    return;
  }
  if (!confirm(`${_uploadPending.length}건의 평가를 [${periodLabel(activePeriod)}] 에 저장합니다. 동일 대상자의 기존 저장값은 업로드 값으로 덮어써집니다. 진행할까요?`)) return;
  const list = [];
  _uploadPending.forEach(item => {
    if (item.s1 !== null) {
      const existing = getEvaluation(item.dept, item.empName, "1차", activePeriod);
      list.push({
        dept: item.dept,
        empName: item.empName,
        empRank: item.empRank,
        rankCategory: item.rankCategory,
        round: "1차",
        period: activePeriod,
        evaluatorName: item.eval1Name,
        scores: existing ? existing.scores : {},
        total: item.s1,
        comment: item.comment1 || (existing ? existing.comment : ""),
        submittedAt: new Date().toISOString(),
        source: "excel-upload"
      });
    }
    if (item.s2 !== null) {
      const existing = getEvaluation(item.dept, item.empName, "2차", activePeriod);
      list.push({
        dept: item.dept,
        empName: item.empName,
        empRank: item.empRank,
        rankCategory: item.rankCategory,
        round: "2차",
        period: activePeriod,
        evaluatorName: item.eval2Name,
        scores: existing ? existing.scores : {},
        total: item.s2,
        comment: item.comment2 || (existing ? existing.comment : ""),
        submittedAt: new Date().toISOString(),
        source: "excel-upload"
      });
    }
  });
  try {
    await bulkUpsertEvaluations(list);
    _uploadPending = null;
    alert(`업로드 완료: ${list.length}개 차수 평가가 반영되었습니다.`);
    renderAdminHome();
  } catch (e) {
    alert("업로드 저장 실패: " + e.message + "\n네트워크 상태 또는 서버 설정을 확인해 주세요.");
  }
}
